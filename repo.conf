# Configuración compartida del repo. La leen setup.sh y .githooks/pre-commit.
#
# ⚠️ Este archivo VA A GIT a propósito (no tiene secretos: los secretos van a
# .env, que está gitignoreado). El modo es un hecho del repo, igual para todos.
# Si fuera por-clon, cualquiera podría ponerse en `solo` y desactivarse el gate
# de rama — justo lo que el modo equipo existe para impedir.

# solo   → un dueño. Se commitea directo a main; los gates son los hooks locales.
# equipo → más de una persona. El pre-commit bloquea commits directos a la rama
#          principal (todo entra por PR) y setup.sh chequea CODEOWNERS.
REPO_MODE=solo

# Rama principal protegida en modo equipo. Ajustar si no se llama main.
MAIN_BRANCH=main
