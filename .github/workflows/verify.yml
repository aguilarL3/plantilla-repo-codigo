# Verificación del repo en cada PR — el mismo gate que corre en tu máquina,
# pero del lado del servidor.
#
# Por qué existe: los hooks de .githooks/ corren en el clon de quien commitea,
# y solo si esa persona corrió `bash setup.sh` (core.hooksPath es config LOCAL:
# no viaja con el repo). Con más de una persona eso no es una garantía, es una
# esperanza — y `--no-verify` la saltea en un teclazo. Acá el chequeo no depende
# de la máquina de nadie.
#
# Qué bloquea y qué no (deliberado):
#   secret-scan  → BLOQUEA. Un secreto en una rama publicada ya se filtró.
#   lint/tests   → BLOQUEAN una vez cableados en el kickoff (paso 6 del README).
#                  Hasta entonces el paso avisa en el resumen en vez de fallar:
#                  un repo recién nacido no tiene suite que correr.
#   bitácora     → informa. El handoff es una convención de agentes, no algo
#                  que tenga sentido imponerle a un humano que arregla un typo.

name: verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # los verificadores comparan contra la base del PR

      - name: Rango del PR
        id: range
        env:
          # Por `env:` y no interpolado en el script: hardening estándar de
          # Actions (un título de rama malicioso no se ejecuta como shell).
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # OJO con `[ cond ] && x=y`: los `run:` corren con `bash -eo pipefail`,
          # así que cuando la condición es FALSA la lista devuelve 1 y el paso
          # falla — justo en el caso normal. Va con if/then, no con `&&`.
          BASE="$PR_BASE"; HEAD="$PR_HEAD"
          # workflow_dispatch: sin payload de PR, se verifica el último commit.
          if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
          if [ -z "$HEAD" ]; then HEAD="$(git rev-parse HEAD)"; fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "Verificando $BASE...$HEAD"

      # ── BLOQUEANTE ───────────────────────────────────────────────────────────
      - name: Secretos (bloquea)
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: bash .claude/hooks/secret-scan.sh --range "$BASE" "$HEAD"

      # ── STACK ────────────────────────────────────────────────────────────────
      # Cablear en el kickoff (paso 6 del README), junto con .githooks/pre-commit.
      # Descomentar el setup del lenguaje y reemplazar los comandos de abajo.
      #
      # - uses: actions/setup-node@v4
      #   with: { node-version: '22', cache: 'npm' }
      # - run: npm ci
      #
      # - uses: actions/setup-python@v5
      #   with: { python-version: '3.12' }
      # - run: pip install -e ".[dev]"
      - name: Lint y tests
        run: |
          # Reemplazar este bloque entero por los comandos reales del stack
          # (`npm run lint && npm test`, `ruff check . && pytest`, …).
          # Mientras no haya stack, el paso avisa en vez de fallar.
          {
            echo "### Lint y tests"
            echo "⚠️ Sin cablear todavía — este PR **no corrió ninguna prueba**."
            echo "Cablealos en \`.github/workflows/verify.yml\` y en \`.githooks/pre-commit\`"
            echo "(paso 6 del kickoff). Hasta entonces el único gate real es el secret-scan."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── INFORMATIVO ──────────────────────────────────────────────────────────
      - name: Handoff en la bitácora
        continue-on-error: true
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          # `-c core.quotepath=false`: sin esto git escapa las rutas no-ASCII
          # (`docs/Migraci\303\263n.md`) y los nombres dejan de resolver.
          CHANGED="$(git -c core.quotepath=false diff --name-only "$BASE...$HEAD")"
          if echo "$CHANGED" | grep -q '^docs/BITACORA.md$'; then
            echo "- handoff registrado en la bitácora" >> "$GITHUB_STEP_SUMMARY"
          elif echo "$CHANGED" | grep -qE '^(src|specs)/'; then
            {
              echo "### Bitácora"
              echo "Este PR toca \`src/\` o \`specs/\` pero no agrega entrada en"
              echo "\`docs/BITACORA.md\`. Si lo hizo un agente, falta su handoff."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
